<body>

<section class="seccion-camara" aria-labelledby="titulo-camara">
    <header class="camara-header">
        <span class="live-badge" aria-label="Transmisión en vivo">
            <span class="live-indicator" aria-hidden="true"></span>
            EN VIVO
        </span>
        <section class="camara-title-section">
           <img src="./icons/logoGPT 21kb.png" 
             alt="Ícono de sitio" 
             class="camara-icon"
             aria-hidden="true" width="50px" >
          <h2 id="titulo-camara" class="camara-title">Cámara en Vivo</h2>
        </section>
        <p class="camara-subtitle">Barra da Lagoa · Transmisión 24/7</p>       
    </header>
    
    <button 
        id="btnControlCamara" 
        class="btn-control"
        aria-controls="contenedorCamara"
        aria-expanded="false">
        <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7z"/>
        </svg>
        <span class="btn-label">Ver Cámara</span>
    </button>

    <div id="contenedorCamara" hidden style="width: 100%; max-width: 960px;">
        <div class="video-wrapper" id="videoWrapper">
            
            <!-- THUMBNAIL PREVIEW (carga ligera ~30KB vs 2MB iframe) -->
            <img 
                id="thumbnailPreview"
                class="thumbnail-preview"
                src="https://img.youtube.com/vi/FfYGm9oeiwk/maxresdefault.jpg"
                alt="Vista previa de la cámara en vivo de Barra da Lagoa"
                loading="eager"
                onerror="this.src='https://img.youtube.com/vi/FfYGm9oeiwk/hqdefault.jpg'">
            
            <div class="thumbnail-overlay" id="thumbnailOverlay">
                <div class="play-button-overlay">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </div>
                <span class="thumbnail-label">▶ Reproducir transmisión en vivo</span>
            </div>

            <!-- Loader (solo aparece mientras carga el iframe) -->
            <div id="loaderCamara" class="loader-camara" role="status" aria-live="polite">
                <div class="spinner" aria-hidden="true"></div>
                <span class="texto-loader">Cargando reproductor...</span>
                <small class="loader-subtexto">Esto puede tardar unos segundos</small>
            </div>
            
            <div id="player"></div>
        </div>
    </div>
</section>


<script src="script.js" defer></script>

</body>
